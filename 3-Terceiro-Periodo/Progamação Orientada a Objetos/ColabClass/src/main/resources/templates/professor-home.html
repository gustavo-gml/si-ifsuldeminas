<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Minhas Turmas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alertas :: alertas}"></div>

<div class="container mt-4 mb-5">

<h2 class="h3 fw-bold mb-4 d-flex align-items-center gap-2">
    <i class="bi bi-mortarboard-fill text-primary"></i>
    Minhas Turmas
</h2>

    <div class="row">

        <div
            class="col-md-4 mb-3"
            th:each="professorTurma : ${turmas}">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h5
                        th:text="${professorTurma.turma.nome}">
                    </h5>

                    <p
                        class="text-muted"
                        th:text="${professorTurma.turma.curso}">
                    </p>

                    <a
                        class="btn btn-primary"
                        th:href="@{/turma/{codigo}(codigo=${professorTurma.turma.codigo})}">

                        Abrir mural

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
