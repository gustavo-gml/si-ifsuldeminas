<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3" th:fragment="navbar">
    <div class="container">

        <a sec:authorize="isAnonymous()"
        class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2"
        href="/">
            <i class="bi bi-mortarboard-fill fs-4"></i> ColabClass
        </a>

        <a sec:authorize="isAuthenticated()"
        class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2"
        href="/home">
            <i class="bi bi-mortarboard-fill fs-4"></i> ColabClass
        </a>

        <button class="navbar-toggler border-0 p-2 shadow-none" type="button" 
                data-bs-toggle="collapse" data-bs-target="#menu" 
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="menu">
            <ul class="navbar-nav ms-auto gap-2">

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-light text-dark text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto" href="/login">
                        <i class="bi bi-box-arrow-in-right me-2 text-primary"></i> Entrar
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-primary text-white text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto" href="/usuario/novo">
                        <i class="bi bi-person-plus me-2"></i> Criar Conta
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-light text-dark text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto" href="/usuario/perfil">
                        <i class="bi bi-person-circle me-2 text-primary"></i> Perfil
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ALUNO','REPRESENTANTE')">
                    <a class="btn btn-light text-dark text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto"
                    href="/meta/listar">
                        <i class="bi bi-check2-square me-2 text-primary"></i>
                        Minhas Metas
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-light text-dark text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto" href="/admin">
                        <i class="bi bi-gear me-2 text-primary"></i> Administração
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-danger text-white text-start px-3 py-2 fw-medium rounded-3 d-flex align-items-center w-100 w-lg-auto" href="/logout">
                        <i class="bi bi-box-arrow-right me-2"></i> Sair
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

</body>
</html>
