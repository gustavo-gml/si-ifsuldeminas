<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="toasts">

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div th:if="${param.sucesso}"
             class="toast text-bg-success border-0"
             id="toastSucesso">

            <div class="d-flex">
                <div class="toast-body">
                    ✅ Operação realizada com sucesso!
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>
            </div>

        </div>


        <div th:if="${param.editado}"
             class="toast text-bg-primary border-0"
             id="toastEditado">

            <div class="d-flex">
                <div class="toast-body">
                    ✏ Registro atualizado com sucesso!
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>
            </div>

        </div>


        <div th:if="${param.excluido}"
             class="toast text-bg-danger border-0"
             id="toastExcluido">

            <div class="d-flex">
                <div class="toast-body">
                    🗑 Registro removido com sucesso!
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
