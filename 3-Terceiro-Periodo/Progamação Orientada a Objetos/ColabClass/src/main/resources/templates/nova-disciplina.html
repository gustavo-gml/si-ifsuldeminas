<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Disciplina | ColabClass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .card { border-radius: 16px; }
        .form-control, .form-select { border-radius: 12px; min-height: 48px; background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .form-control:focus, .form-select:focus { background-color: #fff; box-shadow: none; border-color: #0d6efd; }
        textarea.form-control { min-height: auto; }
        .btn { border-radius: 12px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
        .form-label { font-weight: 500; color: #495057; font-size: 0.9rem; margin-bottom: 0.25rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alertas :: alertas}"></div>

<div class="container mt-4 mb-5 flex-grow-1">
    
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-journal-plus text-success"></i> Cadastrar Disciplina
                </h2>
                <a href="/disciplina/listar" class="btn btn-outline-secondary btn-sm px-3" style="min-height: 38px;">
                    <i class="bi bi-x-lg"></i> Cancelar
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    
                    <form th:action="@{/disciplina/salvar}" th:object="${disciplina}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            
                            <div class="col-12">
                                <label class="form-label">Nome da Disciplina</label>
                                <input type="text" class="form-control" th:field="*{nome}" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Professor</label>
                                <input type="text" class="form-control" th:field="*{professor}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Email do Professor</label>
                                <input type="email" class="form-control" th:field="*{emailProfessor}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Turma</label>
                                <select class="form-select" th:field="*{turma}">
                                    <option th:each="turma : ${turmas}" th:value="${turma.id}" th:text="${turma.nome}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Código Classroom</label>
                                <input type="text" class="form-control" th:field="*{codigoClassroom}">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Horário</label>
                                <input type="text" class="form-control" th:field="*{horario}" placeholder="Ex: Seg 19h - 21h">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Período</label>
                                <input type="number" class="form-control" th:field="*{periodo}">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Ementa</label>
                                <textarea class="form-control" th:field="*{ementa}" rows="4"></textarea>
                            </div>

                            <div class="col-12 my-3">
                                <div class="form-check form-switch fs-5">
                                    <input class="form-check-input shadow-none" type="checkbox" role="switch" id="ativaSwitch" th:field="*{ativa}">
                                    <label class="form-check-label ms-2 fs-6 mt-1" for="ativaSwitch">Disciplina Ativa</label>
                                </div>
                            </div>

                        </div>

                        <hr class="text-muted my-4">

                        <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">
                            <i class="bi bi-check-circle"></i> Salvar Disciplina
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
