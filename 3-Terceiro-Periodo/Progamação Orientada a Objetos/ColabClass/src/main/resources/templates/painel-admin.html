<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Administrador | ColabClass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        /* Áreas de toque e botões */
        .btn {
            min-height: 44px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }
        /* Estilização dos Cards */
        .dashboard-card {
            border-radius: 16px;
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative; /* Necessário para o stretched-link */
        }
        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        /* Tabela Mobile */
        .table-responsive {
            border-radius: 16px;
        }
        .table th, .table td {
            vertical-align: middle;
            padding: 1rem;
        }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-4 mb-5">

    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="icon-box bg-primary text-white shadow-sm">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="h3 fw-bold mb-0 text-dark">Painel do Administrador</h1>
    </div>

    <div class="row g-3 mb-5">
        
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-primary-subtle text-primary">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Usuários</h6>
                        <h3 class="fw-bold mb-0" th:text="${usuarios}">0</h3>
                        <a href="/usuario/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-success-subtle text-success">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Turmas</h6>
                        <h3 class="fw-bold mb-0" th:text="${turmas}">0</h3>
                        <a href="/turma/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-warning-subtle text-warning">
                        <i class="bi bi-calendar-event-fill"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Eventos</h6>
                        <h3 class="fw-bold mb-0" th:text="${eventos}">0</h3>
                        <a href="/evento/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-danger-subtle text-danger">
                        <i class="bi bi-megaphone-fill"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Avisos</h6>
                        <h3 class="fw-bold mb-0" th:text="${avisos}">0</h3>
                        <a href="/aviso/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-info-subtle text-info">
                        <i class="bi bi-journal-bookmark-fill"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Disciplinas</h6>
                        <h3 class="fw-bold mb-0" th:text="${disciplinas}">0</h3>
                        <a href="/disciplina/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm dashboard-card h-100 p-2">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icon-box bg-secondary-subtle text-secondary">
                        <i class="bi bi-link-45deg"></i>
                    </div>
                    <div>
                        <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Links Rápidos</h6>
                        <h3 class="fw-bold mb-0" th:text="${links}">0</h3>
                        <a href="/link/listar" class="stretched-link text-decoration-none"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-3 gap-3">
        <h3 class="h4 fw-bold mb-0 text-dark d-flex align-items-center gap-2">
            <i class="bi bi-building"></i> Gerenciar Turmas
        </h3>
        <a href="/turma/nova" class="btn btn-success shadow-sm w-100 w-sm-auto">
            <i class="bi bi-plus-lg"></i> Nova Turma
        </a>
    </div>

    <div class="table-responsive bg-white shadow-sm border mb-4">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light text-secondary">
                <tr>
                    <th class="fw-semibold border-bottom-0">Nome</th>
                    <th class="fw-semibold border-bottom-0">Curso</th>
                    <th class="fw-semibold border-bottom-0">Código</th>
                    <th class="fw-semibold border-bottom-0">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="turma : ${listaTurmas}">
                    <td class="fw-medium text-dark" th:text="${turma.nome}"></td>
                    <td class="text-muted" th:text="${turma.curso}"></td>
                    <td><span class="badge bg-light text-dark border" th:text="${turma.codigo}"></span></td>
                    <td>
                        <div class="d-flex gap-2 flex-wrap">
                            <a th:href="@{/turma/{codigo}(codigo=${turma.codigo})}" class="btn btn-primary btn-sm flex-grow-1 flex-sm-grow-0" title="Abrir Mural">
                                <i class="bi bi-box-arrow-up-right"></i> <span class="d-inline d-sm-none ms-1">Abrir</span>
                            </a>
                            <a th:href="@{/turma/editar/{id}(id=${turma.id})}" class="btn btn-warning btn-sm flex-grow-1 flex-sm-grow-0" title="Editar">
                                <i class="bi bi-pencil"></i> <span class="d-inline d-sm-none ms-1">Editar</span>
                            </a>
                            <a th:href="@{/turma/excluir/{id}(id=${turma.id})}" class="btn btn-danger btn-sm flex-grow-1 flex-sm-grow-0" onclick="return confirm('Excluir turma?')" title="Excluir">
                                <i class="bi bi-trash"></i> <span class="d-inline d-sm-none ms-1">Excluir</span>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listaTurmas)}">
                    <td colspan="4" class="text-center py-4 text-muted">Nenhuma turma cadastrada.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
