<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil | ColabClass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .card { border-radius: 16px; border: none; }
        .btn { min-height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
        .info-label { font-size: 0.85rem; color: #6c757d; text-transform: uppercase; font-weight: 600; }
        .info-value { font-size: 1.1rem; font-weight: 500; color: #212529; }
        .icon-box { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alertas :: alertas}"></div>

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <h2 class="h3 fw-bold mb-0">Meu Perfil</h2>
                    </div>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item px-0 py-3 d-flex align-items-center gap-3">
                            <div class="icon-box text-primary bg-primary-subtle"><i class="bi bi-person-vcard fs-5"></i></div>
                            <div>
                                <div class="info-label">Nome</div>
                                <div class="info-value" th:text="${usuario.nome}"></div>
                            </div>
                        </li>
                        <li class="list-group-item px-0 py-3 d-flex align-items-center gap-3">
                            <div class="icon-box text-danger bg-danger-subtle"><i class="bi bi-envelope fs-5"></i></div>
                            <div class="text-truncate">
                                <div class="info-label">Email</div>
                                <div class="info-value text-truncate" th:text="${usuario.email}"></div>
                            </div>
                        </li>
                        <li class="list-group-item px-0 py-3 d-flex align-items-center gap-3">
                            <div class="icon-box text-success bg-success-subtle"><i class="bi bi-building fs-5"></i></div>
                            <div>
                                <div class="info-label">Turma</div>
                                <div class="info-value" th:text="${usuario.turma.nome}"></div>
                            </div>
                        </li>
                        <li class="list-group-item px-0 py-3 d-flex align-items-center gap-3">
                            <div class="icon-box text-warning bg-warning-subtle"><i class="bi bi-shield-lock fs-5"></i></div>
                            <div>
                                <div class="info-label">Tipo</div>
                                <div><span class="badge bg-secondary" th:text="${usuario.role}"></span></div>
                            </div>
                        </li>
                    </ul>

                    <div class="d-flex flex-column flex-sm-row gap-3">
                        <a href="javascript:history.back()" class="btn btn-primary w-100 shadow-sm">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <a href="/logout" class="btn btn-outline-danger w-100">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
