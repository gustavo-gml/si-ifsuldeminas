<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gerenciar Murais</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h2>Gerenciar Murais</h2>

    <div class="card mt-4">

        <div class="card-body">

            <h4 th:text="${professor.nome}"></h4>

            <p class="text-muted"
               th:text="${professor.email}">
            </p>

            <hr>

            <form
      method="post"
      th:action="@{/usuario/{id}/murais(id=${professor.id})}">

    <table class="table table-hover">

        <thead>

            <tr>

                <th>Mostrar</th>

                <th>Turma</th>

                <th>Curso</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="turma : ${turmas}">

                <td>

                    <div class="form-check form-switch">

                    <input

                        class="form-check-input"

                        type="checkbox"

                        name="turmasSelecionadas"

                        th:value="${turma.id}"

                        th:checked="${selecionadas.contains(turma.id)}">

                    </div>

                </td>

                <td
                    th:text="${turma.nome}">
                </td>

                <td
                    th:text="${turma.curso}">
                </td>

            </tr>

        </tbody>

    </table>

<div class="mt-4 d-flex justify-content-between">

    <a href="/usuario/listar"
       class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>

        Voltar

    </a>

    <button
        type="submit"
        class="btn btn-success">

        <i class="bi bi-check-circle"></i>

        Salvar Alterações

    </button>

</div>

</form>

            <a href="/usuario/listar"
               class="btn btn-secondary">

                Voltar

            </a>

        </div>

    </div>

</div>

</body>

</html>
