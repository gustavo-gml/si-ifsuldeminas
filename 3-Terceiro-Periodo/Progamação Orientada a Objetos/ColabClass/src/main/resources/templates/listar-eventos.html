<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eventos | ColabClass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .btn {
            min-height: 44px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }
        .table-container {
            border-radius: 16px;
            overflow: hidden;
        }
        .table th, .table td {
            vertical-align: middle;
            padding: 1rem;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5 flex-grow-1">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <h2 class="h3 fw-bold mb-0 text-dark d-flex align-items-center gap-2">
            <i class="bi bi-calendar-event-fill text-warning"></i> Eventos
        </h2>

        <div class="d-flex flex-column flex-sm-row gap-2">
            <a href="/admin" class="btn btn-secondary w-100 w-sm-auto shadow-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <a href="/evento/novo" class="btn btn-success w-100 w-sm-auto shadow-sm">
                <i class="bi bi-plus-lg"></i> Novo Evento
            </a>
        </div>
    </div>

    <div class="table-container shadow-sm border bg-white">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light text-secondary">
                    <tr>
                        <th class="fw-semibold border-bottom-0">Título</th>
                        <th class="fw-semibold border-bottom-0">Data</th>
                        <th class="fw-semibold border-bottom-0">Turma</th>
                        <th class="fw-semibold border-bottom-0">Autor</th>
                        <th class="fw-semibold border-bottom-0 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="evento : ${eventos}">
                        <td class="fw-bold text-dark" th:text="${evento.titulo}"></td>
                        
                        <td class="text-muted">
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="${#temporals.format(evento.data,'dd/MM/yyyy')}"></span>
                        </td>
                        
                        <td>
                            <span class="badge bg-primary-subtle text-primary border" th:text="${evento.turma.nome}"></span>
                        </td>
                        
                        <td class="text-muted small">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="${evento.autor != null ? evento.autor.nome : 'Sistema'}"></span>
                        </td>
                        
                        <td>
                            <div class="d-flex gap-2 justify-content-sm-center">
                                <a th:href="@{/evento/editar/{id}(id=${evento.id})}" class="btn btn-warning btn-sm flex-grow-1 flex-sm-grow-0" title="Editar">
                                    <i class="bi bi-pencil"></i> <span class="d-inline d-sm-none ms-1">Editar</span>
                                </a>
                                <a th:href="@{/evento/excluir/{id}(id=${evento.id})}" class="btn btn-danger btn-sm flex-grow-1 flex-sm-grow-0" onclick="return confirm('Deseja excluir este evento?')" title="Excluir">
                                    <i class="bi bi-trash"></i> <span class="d-inline d-sm-none ms-1">Excluir</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    
                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="5" class="text-center py-4 text-muted">Nenhum evento cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
